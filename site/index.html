  <style>:root {
  --max-width: 980px;
  --bg: #f7f8fb;
  --card-bg: #ffffff;
  --text: #111827;
  --muted: #4b5563;
  --soft: #6b7280;
  --line: #e5e7eb;
  --accent: #111827;
  --shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  line-height: 1.65;
}

.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 36px 20px 60px;
}

/* topbar */
.topbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 18px;
}

.lang-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: #fff;
  box-shadow: var(--shadow);
}

.lang-switch button {
  border: 0;
  background: #fff;
  color: var(--text);
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s ease;
}

.lang-switch button:hover {
  background: #f3f4f6;
}

.lang-switch button.active {
  background: var(--accent);
  color: #fff;
}

/* hero header */
.header {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 34px 28px 24px;
  text-align: center;
  margin-bottom: 26px;
}

.name {
  margin: 0;
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.meta {
  margin-top: 14px;
  font-size: 15px;
  color: var(--muted);
  line-height: 1.8;
}

.meta a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid rgba(17, 24, 39, 0.25);
}

.meta a:hover {
  color: var(--text);
  border-bottom-color: var(--text);
}

hr {
  display: none;
}

/* section card */
.section {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 22px 18px;
  margin: 18px 0;
}

.section h2 {
  margin: 0 0 16px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--soft);
}

/* item rows */
.item {
  margin: 0;
  padding: 14px 0;
  border-top: 1px solid var(--line);
}

.section .item:first-of-type {
  border-top: 0;
  padding-top: 4px;
}

.item .row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}

.item .title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}

.item .period {
  flex-shrink: 0;
  white-space: nowrap;
  font-size: 13px;
  color: var(--soft);
  background: #f3f4f6;
  padding: 3px 10px;
  border-radius: 999px;
}

.item .sub {
  margin-top: 6px;
  font-size: 14px;
  color: var(--muted);
}

.small {
  font-size: 14px;
  color: var(--muted);
}

/* lists */
ul,
ol {
  margin: 8px 0 0 20px;
  padding: 0;
}

li {
  margin: 6px 0;
}

.section ol li {
  margin: 12px 0 18px;
}

/* publications */
.section ol {
  margin-left: 22px;
}

.section ol li > div:first-child {
  font-size: 16px;
  line-height: 1.45;
}

.section ol li .small {
  margin-top: 3px;
}

/* links */
a {
  color: inherit;
}

a:hover {
  text-decoration: none;
}

/* optional subtle section spacing */
.section + .section {
  margin-top: 20px;
}

/* mobile */
@media (max-width: 720px) {
  .container {
    padding: 20px 14px 40px;
  }

  .header {
    padding: 24px 18px 18px;
    border-radius: 18px;
  }

  .name {
    font-size: 32px;
  }

  .meta {
    font-size: 14px;
  }

  .section {
    padding: 18px 16px 14px;
    border-radius: 14px;
  }

  .item .row {
    flex-direction: column;
    gap: 6px;
  }

  .item .period {
    white-space: normal;
  }
}

.bio {

.bio p {

.bio p:last-child {

.cv-download {

.cv-download select {

  <script>
    const pages = {"en": "\n    <div class=\"header\">\n      <div class=\"header-inner\">\n        <div class=\"header-text\">\n          <h1 class=\"name\">Bin Hu</h1>\n          <div class=\"meta\">Los Angeles, CA, USA<br/><a href=\"mailto:hubin@usc.edu\">hubin@usc.edu</a> | <a href=\"mailto:292419703@qq.com\">292419703@qq.com</a><br/>+1 6124563527 | +86 15366075527<br/>Website: <a href=\"https://Hbbbba.github.io/Resume/\">https://Hbbbba.github.io/Resume/</a><br/><span class=\"cv-download\"><label for=\"cv-version\">CV version</label> <select id=\"cv-version\" onchange=\"updateCvLink(this)\"><option value=\"https://Hbbbba.github.io/Resume/cv_en.pdf\">Full CV</option><option value=\"cv_en_2page.pdf\">2 pages</option><option value=\"cv_en_1page.pdf\">1 page</option></select> <a id=\"cv-link\" href=\"https://Hbbbba.github.io/Resume/cv_en.pdf\" download>Download CV (PDF)</a></span></div>\n        </div>\n        \n        <div class=\"profile-photo-wrap\">\n          <img class=\"profile-photo\" src=\"assets/profile.jpg\" alt=\"Bin Hu\">\n        </div>\n        \n      </div>\n      <div class=\"bio\"><p>I am a Ph.D. student in Electrical and Computer Engineering at the University of Southern California, advised by Professor Feng Qian, with expected graduation in May 2028. My research focuses on satellite networking, networked systems, and self-supervised world models for network control. I combine network measurement, predictive modeling, and systems development to improve application performance under dynamic network conditions. My recent projects explore satellite-link prediction, real-time video communication, and reusable network representations for adaptive streaming and congestion control.</p><p>I am seeking  research internships in networking and systems and am also interested in systems software engineering opportunities.</p></div>\n    </div>\n    \n<hr/>\n<div class=\"section\"><h2>Education</h2>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">University of Southern California (USC)</div><div class=\"period\">Aug. 2023 – May 2028 (Expected)</div></div>\n<div class=\"sub\"><div><b>Ph.D. in Electrical and Computer Engineering</b></div><div>Ming Hsieh Department of Electrical and Computer Engineering</div><div class=\"small\">Los Angeles, CA, USA</div></div>\n<div><b>Research Area:</b> Networked Systems, Satellite and Mobile Networks, Real-Time Video, Machine Learning</div>\n<div><b>Advisor:</b> Prof. Feng Qian</div>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">University of Minnesota, Twin Cities</div><div class=\"period\">Aug. 2022 – Aug. 2023</div></div>\n<div class=\"sub\"><div><b>Doctoral studies in Computer Science and Engineering (transferred to USC with advisor)</b></div><div>Department of Computer Science and Engineering</div><div class=\"small\">Minneapolis, MN, USA</div></div>\n<div><b>Research Area:</b> Computer Networks, Wireless Communication</div>\n<div><b>Advisor:</b> Prof. Feng Qian</div>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">Southeast University (SEU)</div><div class=\"period\">Sept. 2019 – Jun. 2022</div></div>\n<div class=\"sub\"><div><b>M.Sc. in Computer Science and Engineering</b></div><div>School of Computer Science and Engineering</div><div class=\"small\">Nanjing, China</div></div>\n<div><b>Research Area:</b> Internet of Things, Wireless Communication</div>\n<div><b>Advisor:</b> Prof. Tian He</div>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">Singapore University of Technology and Design (SUTD)</div><div class=\"period\">May 2021 – May 2022</div></div>\n<div class=\"sub\"><div><b>Exchange Student / Research Assistant</b></div><div>Pillar of Information Systems Technology and Design</div><div class=\"small\">Singapore</div></div>\n<div><b>Research Area:</b> Automatic Modulation Classification, Explainable AI</div>\n<div><b>Advisor:</b> Prof. Wenchao Jiang</div>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">Southeast University (SEU)</div><div class=\"period\">Sept. 2015 – Jun. 2019</div></div>\n<div class=\"sub\"><div><b>B.Eng. in Computer Science and Engineering</b></div><div>School of Computer Science and Engineering</div><div class=\"small\">Nanjing, China</div></div>\n</div>\n</div>\n<div class=\"section\"><h2>Research &amp; Experience</h2>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">University of Southern California / University of Minnesota</div><div class=\"period\">Aug. 2022 – Present</div></div>\n<div class=\"sub\"><b>Ph.D. Student</b></div>\n<ul>\n<li>Net-JEPA: Contribute to research on a 4M-parameter self-supervised world model that learns reusable network dynamics from telemetry for adaptive bitrate streaming (ABR) and congestion control (CC).</li>\n<li>The framework combines latent dynamics prediction with lightweight linear readouts and model predictive control; ABR pretraining uses over 450,000 Puffer streams spanning more than 225,000 viewer sessions.</li>\n<li>In trace-driven evaluation, the frozen ABR-pretrained model transfers to CC by fitting only the readout on 20 traces, achieving capacity forecast MSLE of 0.84 versus 1.93 for random initialization in an open-loop fluid-queue emulator.</li>\n<li>Satellite link prediction (HotMobile 2026): Co-authored a hierarchical framework combining satellite geometry and network telemetry to predict upcoming connections, connection-window performance, and per-second link dynamics.</li>\n<li>Real-system evaluation on Starlink achieved throughput and latency mean absolute errors of 8.37 Mbps and 14.25 ms, respectively, versus 29.54 Mbps and 26.31 ms for a self-similar baseline.</li>\n<li>Video-call optimization (INFOCOM 2026 Poster): Co-authored a prediction-driven design for adapting video transmission and reconstruction to anticipated satellite-link degradation.</li>\n<li>Proposed a multi-satellite extension that prioritizes essential video information on higher-quality paths; preliminary measurements showed higher aggregate throughput and lower packet loss than single-dish configurations.</li>\n<li>Developed a multipath system using low-cost Raspberry Pi relay nodes to improve satellite network performance.</li>\n<li>Developed a WebRTC-based measurement system to record real-time video-call quality for networking research experiments.</li>\n<li>Developed an Android application to measure network latency and packet loss for networking research experiments.</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">Singapore University of Technology and Design (SUTD)</div><div class=\"period\">May 2021 – Apr. 2022</div></div>\n<div class=\"sub\"><b>Research Assistant</b></div>\n<ul>\n<li>Worked on Explainable AI (XAI) for Automatic Modulation Classification (AMC)</li>\n<li>Combined XAI techniques with wireless communication systems</li>\n<li>Designed interpretable ML models for signal classification</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">Singapore University of Technology and Design (SUTD)</div><div class=\"period\">Jul. 2021</div></div>\n<div class=\"sub\"><b>Research Assistant</b></div>\n<ul>\n<li>Designed and implemented an AI-based software modulator</li>\n<li>Achieved low-cost and high-flexibility design</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">Southeast University (SEU)</div><div class=\"period\">Sept. 2019 – Oct. 2020</div></div>\n<div class=\"sub\"><b>Graduate Student Researcher</b></div>\n<ul>\n<li>Studied concurrent communication in LoRa networks</li>\n<li>Designed and evaluated a multi-dimensional demodulator</li>\n<li>Published ICNP 2020 paper on collided LoRa transmission decoding</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">Southeast University (SEU)</div><div class=\"period\">Jun. 2021</div></div>\n<div class=\"sub\"><b>Graduate Student Researcher</b></div>\n<ul>\n<li>Focused on collision detection in wireless transmission</li>\n<li>Implemented fine-grained self-correlation detector</li>\n<li>Published WASA 2021 paper</li>\n</ul>\n</div>\n</div>\n<div class=\"section\"><h2>Publications</h2>\n<ol>\n<li>\n<div><b>Prediction-Driven QoE Optimization for Video Calls over LEO Satellite Networks</b></div>\n<div class='small'>Bin Hu, Ritvik Janamsetty, Anlan Zhang, Feng Qian</div>\n<div class='small'><b>IEEE Conference on Computer Communications (INFOCOM), 2026, Poster</b></div>\n<div class='small'>DOI: <a href='https://doi.org/10.1109/INFOCOM59046.2026.11571440'>10.1109/INFOCOM59046.2026.11571440</a></div>\n</li>\n<li>\n<div><b>Predicting Connectivity and Link Performance in Dynamic LEO Satellite Networks</b></div>\n<div class='small'>Bin Hu, Feng Qian, Ahmad Hassan, Z. Morley Mao, Zhi-Li Zhang</div>\n<div class='small'><b>ACM Workshop on Hot Topics in Mobile Computing (HotMobile), 2026</b></div>\n</li>\n<li>\n<div><b>Joint Multidimensional Features for LoRa Reception in Burst Traffic</b></div>\n<div class='small'>Kai Sun, Bin Hu, Zhimeng Yin, Shuai Wang, Shuai Wang, Zhuqing Xu, Tian He</div>\n<div class='small'><b>Computer Networks, 2025, Vol. 270, 111476</b></div>\n<div class='small'>DOI: <a href='https://doi.org/10.1016/j.comnet.2025.111476'>10.1016/j.comnet.2025.111476</a></div>\n</li>\n<li>\n<div><b>NN-Defined Modulator: Reconfigurable and Portable Software Modulator on IoT Gateways</b></div>\n<div class='small'>Jiazhao Wang, Wenchao Jiang, Ruofeng Liu, Bin Hu, Demin Gao, Shuai Wang</div>\n<div class='small'><b>USENIX Symposium on Networked Systems Design and Implementation (NSDI), 2024</b></div>\n</li>\n<li>\n<div><b>LEO Satellite vs. Cellular Networks: Exploring the Potential for Synergistic Integration</b></div>\n<div class='small'>Bin Hu, Xumiao Zhang, Qixin Zhang, Nitin Varyani, Z. Morley Mao, Feng Qian, Zhi-Li Zhang</div>\n<div class='small'><b>ACM CoNEXT Companion, 2023</b></div>\n</li>\n<li>\n<div><b>Leveraging Fine-Grained Self-Correlation in Detecting Collided LoRa Transmissions</b></div>\n<div class='small'>Wenwei Li, Bin Hu, Xiaolei Zhou, Shuai Wang</div>\n<div class='small'><b>International Conference on Wireless Algorithms, Systems, and Applications (WASA), 2021</b></div>\n</li>\n<li>\n<div><b>SCLoRa: Leveraging Multi-Dimensionality in Decoding Collided LoRa Transmissions</b></div>\n<div class='small'>Bin Hu, Zhimeng Yin, Shuai Wang, Zhuqing Xu, Tian He</div>\n<div class='small'><b>IEEE International Conference on Network Protocols (ICNP), 2020</b></div>\n</li>\n</ol></div>\n<div class=\"section\"><h2>Technical Skills</h2><ul>\n<li>Programming: Python, C/C++, Java, MATLAB</li>\n<li>Research: Self-Supervised Learning and Network World Models, Model Predictive Control for Networked Systems, Satellite and Mobile Networking, Network Measurement and Performance Prediction, Real-Time Video Systems, Signal Processing and Digital Communication, Wireless Communication Systems, Explainable Artificial Intelligence (XAI)</li>\n<li>Tools &amp; Platforms: Android App Development for Network Measurement, PyTorch, Linux, WebRTC, Packet Capture and Analysis, GNURadio, MATLAB Toolboxes, Software Defined Radios (SDR)</li>\n</ul></div>\n<div class=\"section\"><h2>Funded Projects</h2><ul>\n<li><b>National Key R&amp;D Program of China</b> — Gateway-free cross-technology communication among heterogeneous devices</li>\n<li><b>National Natural Science Foundation of China (NSFC)</b>\n<ul>\n<li>Large-scale industrial LoRa network concurrent transmission</li>\n<li>Energy-efficient LPWAN communication mechanisms</li>\n<li>Direct connection mechanisms for heterogeneous IoT systems</li>\n</ul>\n</li>\n</ul></div>\n<div class=\"section\"><h2>Industry Experience</h2>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">Guangzhou Desheng Artificial Intelligence Technology Co. Ltd.</div><div class=\"period\">Aug. 2018</div></div>\n<div class=\"sub\"><b>Algorithm Engineer (Intern)</b></div>\n<ul>\n<li>Developed camera-based assisted driving systems</li>\n<li>Implemented driver behavior detection and warning algorithms</li>\n</ul>\n</div>\n</div>\n<div class=\"section\"><h2>Honors &amp; Awards</h2><ul>\n<li>Student Travel Grant, ACM HotMobile 2026</li>\n<li>Second Prize, Academic Scholarship, Southeast University (2019, 2020)</li>\n<li>National Second Prize, National College Student Smart Car Competition (2018)</li>\n<li>Provincial Second Prize, National College Student Smart Car Competition (2018)</li>\n<li>Merit Student of Southeast University (2017)</li>\n<li>Outstanding Student, School of Computer Science and Engineering, SEU (2016)</li>\n</ul></div>\n<div class=\"section\"><h2>References</h2>\n<div class='item'>\n<div class='title'>Feng Qian</div>\n<div class='small'>Associate Professor — University of Southern California</div>\n<div class='small'>Email: <a href='mailto:fengqian@usc.edu'>fengqian@usc.edu</a></div>\n</div>\n<div class='item'>\n<div class='title'>Tian He</div>\n<div class='small'>Professor, ACM/IEEE Fellow — Southeast University</div>\n<div class='small'>Email: <a href='mailto:tianhe@seu.edu.cn'>tianhe@seu.edu.cn</a></div>\n</div>\n<div class='item'>\n<div class='title'>Shuai Wang</div>\n<div class='small'>Professor — Southeast University</div>\n<div class='small'>Email: <a href='mailto:shuaiwang@seu.edu.cn'>shuaiwang@seu.edu.cn</a></div>\n</div>\n<div class='item'>\n<div class='title'>Zhimeng Yin</div>\n<div class='small'>Assistant Professor — City University of Hong Kong</div>\n<div class='small'>Email: <a href='mailto:zhimeyin@cityu.edu.hk'>zhimeyin@cityu.edu.hk</a></div>\n</div>\n<div class='item'>\n<div class='title'>Wenchao Jiang</div>\n<div class='small'>Assistant Professor — Singapore University of Technology and Design</div>\n<div class='small'>Email: <a href='mailto:wenchao_jiang@sutd.edu.sg'>wenchao_jiang@sutd.edu.sg</a></div>\n</div>\n</div>", "zh": "\n    <div class=\"header\">\n      <div class=\"header-inner\">\n        <div class=\"header-text\">\n          <h1 class=\"name\">胡斌</h1>\n          <div class=\"meta\">美国加州洛杉矶<br/><a href=\"mailto:hubin@usc.edu\">hubin@usc.edu</a> | <a href=\"mailto:292419703@qq.com\">292419703@qq.com</a><br/>+1 6124563527 | +86 15366075527<br/>主页: <a href=\"https://Hbbbba.github.io/Resume/\">https://Hbbbba.github.io/Resume/</a><br/><span class=\"cv-download\"><label for=\"cv-version\">简历版本</label> <select id=\"cv-version\" onchange=\"updateCvLink(this)\"><option value=\"https://Hbbbba.github.io/Resume/cv_zh.pdf\">完整版</option><option value=\"cv_zh_2page.pdf\">两页版</option><option value=\"cv_zh_1page.pdf\">一页版</option></select> <a id=\"cv-link\" href=\"https://Hbbbba.github.io/Resume/cv_zh.pdf\" download>下载简历（PDF）</a></span></div>\n        </div>\n        \n        <div class=\"profile-photo-wrap\">\n          <img class=\"profile-photo\" src=\"assets/profile.jpg\" alt=\"胡斌\">\n        </div>\n        \n      </div>\n      <div class=\"bio\"><p>我是南加州大学电子与计算机工程博士研究生，导师为钱风教授，预计于 2028 年 5 月毕业。我的研究聚焦于卫星网络、网络系统以及用于网络控制的自监督世界模型。我结合网络测量、预测建模和系统开发，改善动态网络条件下的应用性能。近期项目涉及卫星链路预测、实时视频通信，以及用于自适应流媒体与拥塞控制的可复用网络表征。</p><p>我正在寻找网络与系统方向的研究实习，也对系统软件工程机会感兴趣。</p></div>\n    </div>\n    \n<hr/>\n<div class=\"section\"><h2>教育经历</h2>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">南加州大学（USC）</div><div class=\"period\">2023年8月 – 2028年5月（预计）</div></div>\n<div class=\"sub\"><div><b>电子与计算机工程博士</b></div><div>Ming Hsieh 电子与计算机工程系</div><div class=\"small\">美国加州洛杉矶</div></div>\n<div><b>研究方向:</b> 网络系统、卫星与移动网络、实时视频、机器学习</div>\n<div><b>导师:</b> 钱风教授</div>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">明尼苏达大学双城分校</div><div class=\"period\">2022年8月 – 2023年8月</div></div>\n<div class=\"sub\"><div><b>计算机科学与工程博士阶段学习（随导师转至南加州大学）</b></div><div>计算机科学与工程系</div><div class=\"small\">美国明尼苏达州明尼阿波利斯</div></div>\n<div><b>研究方向:</b> 计算机网络、无线通信</div>\n<div><b>导师:</b> 钱风教授</div>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">东南大学（SEU）</div><div class=\"period\">2019年9月 – 2022年6月</div></div>\n<div class=\"sub\"><div><b>计算机科学与工程硕士</b></div><div>计算机科学与工程学院</div><div class=\"small\">中国南京</div></div>\n<div><b>研究方向:</b> 物联网、无线通信</div>\n<div><b>导师:</b> 何田教授</div>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">新加坡科技设计大学（SUTD）</div><div class=\"period\">2021年5月 – 2022年5月</div></div>\n<div class=\"sub\"><div><b>交换生 / 研究助理</b></div><div>信息系统技术与设计方向</div><div class=\"small\">新加坡</div></div>\n<div><b>研究方向:</b> 自动调制识别、可解释人工智能</div>\n<div><b>导师:</b> 蒋文超教授</div>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">东南大学（SEU）</div><div class=\"period\">2015年9月 – 2019年6月</div></div>\n<div class=\"sub\"><div><b>计算机科学与工程学士</b></div><div>计算机科学与工程学院</div><div class=\"small\">中国南京</div></div>\n</div>\n</div>\n<div class=\"section\"><h2>科研与经历</h2>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">南加州大学 / 明尼苏达大学双城分校</div><div class=\"period\">2022年8月 – 至今</div></div>\n<div class=\"sub\"><b>博士研究生</b></div>\n<ul>\n<li>Net-JEPA：参与约 400 万参数的自监督世界模型研究，从网络遥测学习可复用的网络动态表征，支持自适应码率流媒体（ABR）与拥塞控制（CC）。</li>\n<li>该框架结合潜在动态预测、轻量线性读出与模型预测控制；ABR 预训练使用超过 45 万条 Puffer 流记录，覆盖逾 22.5 万个观看会话。</li>\n<li>在轨迹驱动评估中，冻结 ABR 预训练模型，仅用 20 条轨迹拟合读出即可迁移至 CC；在开环流体队列仿真器中，容量预测 MSLE 为 0.84，随机初始化基线为 1.93。</li>\n<li>卫星链路预测（HotMobile 2026）：合作提出融合卫星几何信息与网络遥测的分层框架，预测下一次卫星连接、连接窗口性能及逐秒链路变化。</li>\n<li>在真实 Starlink 系统上的评估中，吞吐量与时延平均绝对误差分别为 8.37 Mbps 和 14.25 ms，自相似基线分别为 29.54 Mbps 和 26.31 ms。</li>\n<li>视频通话优化（INFOCOM 2026 海报）：合作提出预测驱动的视频传输与重建设计，提前适应卫星链路性能下降。</li>\n<li>提出多卫星扩展设计，优先通过高质量路径传输关键视频信息；初步测量显示，相比单终端配置可提高总吞吐量并降低丢包率。</li>\n<li>开发采用低成本 Raspberry Pi 中继节点的多路径系统，以改善卫星网络性能。</li>\n<li>开发基于 WebRTC 的测量系统，记录实时视频通话质量，支持网络研究实验。</li>\n<li>开发用于测量网络时延与丢包率的 Android 应用，支持网络研究实验。</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">新加坡科技设计大学（SUTD）</div><div class=\"period\">2021年5月 – 2022年4月</div></div>\n<div class=\"sub\"><b>研究助理</b></div>\n<ul>\n<li>开展面向自动调制识别（AMC）的可解释人工智能（XAI）研究</li>\n<li>将可解释人工智能方法与无线通信系统结合</li>\n<li>设计用于信号分类的可解释机器学习模型</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">新加坡科技设计大学（SUTD）</div><div class=\"period\">2021年7月</div></div>\n<div class=\"sub\"><b>研究助理</b></div>\n<ul>\n<li>设计并实现基于人工智能的软件调制器</li>\n<li>实现了低成本、高灵活性的设计方案</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">东南大学（SEU）</div><div class=\"period\">2019年9月 – 2020年10月</div></div>\n<div class=\"sub\"><b>研究生科研人员</b></div>\n<ul>\n<li>研究 LoRa 网络中的并发通信问题</li>\n<li>设计并评估多维解调器</li>\n<li>发表关于冲突 LoRa 传输解码的 ICNP 2020 论文</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">东南大学（SEU）</div><div class=\"period\">2021年6月</div></div>\n<div class=\"sub\"><b>研究生科研人员</b></div>\n<ul>\n<li>聚焦无线传输中的冲突检测问题</li>\n<li>实现细粒度自相关检测器</li>\n<li>发表 WASA 2021 论文</li>\n</ul>\n</div>\n</div>\n<div class=\"section\"><h2>论文发表</h2>\n<ol>\n<li>\n<div><b>Prediction-Driven QoE Optimization for Video Calls over LEO Satellite Networks</b></div>\n<div class='small'>Bin Hu, Ritvik Janamsetty, Anlan Zhang, Feng Qian</div>\n<div class='small'><b>IEEE Conference on Computer Communications (INFOCOM), 2026, 海报论文</b></div>\n<div class='small'>DOI: <a href='https://doi.org/10.1109/INFOCOM59046.2026.11571440'>10.1109/INFOCOM59046.2026.11571440</a></div>\n</li>\n<li>\n<div><b>Predicting Connectivity and Link Performance in Dynamic LEO Satellite Networks</b></div>\n<div class='small'>Bin Hu, Feng Qian, Ahmad Hassan, Z. Morley Mao, Zhi-Li Zhang</div>\n<div class='small'><b>ACM Workshop on Hot Topics in Mobile Computing (HotMobile), 2026</b></div>\n</li>\n<li>\n<div><b>Joint Multidimensional Features for LoRa Reception in Burst Traffic</b></div>\n<div class='small'>Kai Sun, Bin Hu, Zhimeng Yin, Shuai Wang, Shuai Wang, Zhuqing Xu, Tian He</div>\n<div class='small'><b>Computer Networks, 2025, Vol. 270, 111476</b></div>\n<div class='small'>DOI: <a href='https://doi.org/10.1016/j.comnet.2025.111476'>10.1016/j.comnet.2025.111476</a></div>\n</li>\n<li>\n<div><b>NN-Defined Modulator: Reconfigurable and Portable Software Modulator on IoT Gateways</b></div>\n<div class='small'>Jiazhao Wang, Wenchao Jiang, Ruofeng Liu, Bin Hu, Demin Gao, Shuai Wang</div>\n<div class='small'><b>USENIX Symposium on Networked Systems Design and Implementation (NSDI), 2024</b></div>\n</li>\n<li>\n<div><b>LEO Satellite vs. Cellular Networks: Exploring the Potential for Synergistic Integration</b></div>\n<div class='small'>Bin Hu, Xumiao Zhang, Qixin Zhang, Nitin Varyani, Z. Morley Mao, Feng Qian, Zhi-Li Zhang</div>\n<div class='small'><b>ACM CoNEXT Companion, 2023</b></div>\n</li>\n<li>\n<div><b>Leveraging Fine-Grained Self-Correlation in Detecting Collided LoRa Transmissions</b></div>\n<div class='small'>Wenwei Li, Bin Hu, Xiaolei Zhou, Shuai Wang</div>\n<div class='small'><b>International Conference on Wireless Algorithms, Systems, and Applications (WASA), 2021</b></div>\n</li>\n<li>\n<div><b>SCLoRa: Leveraging Multi-Dimensionality in Decoding Collided LoRa Transmissions</b></div>\n<div class='small'>Bin Hu, Zhimeng Yin, Shuai Wang, Zhuqing Xu, Tian He</div>\n<div class='small'><b>IEEE International Conference on Network Protocols (ICNP), 2020</b></div>\n</li>\n</ol></div>\n<div class=\"section\"><h2>技术技能</h2><ul>\n<li>编程语言: Python, C/C++, Java, MATLAB</li>\n<li>研究领域: 自监督学习与网络世界模型, 面向网络系统的模型预测控制, 卫星与移动网络, 网络测量与性能预测, 实时视频系统, 信号处理与数字通信, 无线通信系统, 可解释人工智能（XAI）</li>\n<li>工具与平台: 面向网络测量的 Android 应用开发, PyTorch, Linux, WebRTC, 数据包捕获与分析, GNURadio, MATLAB 工具箱, 软件定义无线电（SDR）</li>\n</ul></div>\n<div class=\"section\"><h2>科研项目</h2><ul>\n<li><b>国家重点研发计划</b> — 异构设备间无网关跨技术通信</li>\n<li><b>国家自然科学基金（NSFC）</b>\n<ul>\n<li>大规模工业 LoRa 网络并发传输</li>\n<li>高能效 LPWAN 通信机制</li>\n<li>异构物联网系统直接连接机制</li>\n</ul>\n</li>\n</ul></div>\n<div class=\"section\"><h2>工业界经历</h2>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">广州德晟人工智能科技有限公司</div><div class=\"period\">2018年8月</div></div>\n<div class=\"sub\"><b>算法工程师（实习）</b></div>\n<ul>\n<li>开发基于摄像头的辅助驾驶系统</li>\n<li>实现驾驶员行为检测与预警算法</li>\n</ul>\n</div>\n</div>\n<div class=\"section\"><h2>荣誉奖项</h2><ul>\n<li>ACM HotMobile 2026 学生差旅资助</li>\n<li>东南大学学业奖学金二等奖（2019、2020）</li>\n<li>全国大学生智能汽车竞赛国家二等奖（2018）</li>\n<li>全国大学生智能汽车竞赛省级二等奖（2018）</li>\n<li>东南大学三好学生（2017）</li>\n<li>东南大学计算机科学与工程学院优秀学生（2016）</li>\n</ul></div>\n<div class=\"section\"><h2>推荐人</h2>\n<div class='item'>\n<div class='title'>钱风</div>\n<div class='small'>副教授 — 南加州大学</div>\n<div class='small'>邮箱: <a href='mailto:fengqian@usc.edu'>fengqian@usc.edu</a></div>\n</div>\n<div class='item'>\n<div class='title'>何田</div>\n<div class='small'>教授，ACM/IEEE Fellow — 东南大学</div>\n<div class='small'>邮箱: <a href='mailto:tianhe@seu.edu.cn'>tianhe@seu.edu.cn</a></div>\n</div>\n<div class='item'>\n<div class='title'>王帅</div>\n<div class='small'>教授 — 东南大学</div>\n<div class='small'>邮箱: <a href='mailto:shuaiwang@seu.edu.cn'>shuaiwang@seu.edu.cn</a></div>\n</div>\n<div class='item'>\n<div class='title'>尹知萌</div>\n<div class='small'>助理教授 — 香港城市大学</div>\n<div class='small'>邮箱: <a href='mailto:zhimeyin@cityu.edu.hk'>zhimeyin@cityu.edu.hk</a></div>\n</div>\n<div class='item'>\n<div class='title'>蒋文超</div>\n<div class='small'>助理教授 — 新加坡科技设计大学</div>\n<div class='small'>邮箱: <a href='mailto:wenchao_jiang@sutd.edu.sg'>wenchao_jiang@sutd.edu.sg</a></div>\n</div>\n</div>"};
