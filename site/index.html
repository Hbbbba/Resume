ications (WASA), 2021</b></div>\n</li>\n<li>\n<div><b>SCLoRa: Leveraging Multi-Dimensionality in Decoding Collided LoRa Transmissions</b></div>\n<div class='small'>Bin Hu, Zhimeng Yin, Shuai Wang, Zhuqing Xu, Tian He</div>\n<div class='small'><b>IEEE International Conference on Network Protocols (ICNP), 2020</b></div>\n</li>\n</ol></div>\n<div class=\"section\"><h2>科研与经历</h2>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">南加州大学 / 明尼苏达大学双城分校</div><div class=\"period\">2022年8月 – 至今</div></div>\n<div class=\"sub\"><b>博士研究生</b></div>\n<ul>\n<li>研究 Starlink 低轨卫星网络与 5G 网络的性能及系统特性</li>\n<li>聚焦跨层网络设计与性能建模</li>\n<li>研究网络动态、切换机制以及无线与卫星网络融合</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">新加坡科技设计大学（SUTD）</div><div class=\"period\">2021年5月 – 2022年4月</div></div>\n<div class=\"sub\"><b>研究助理</b></div>\n<ul>\n<li>开展面向自动调制识别（AMC）的可解释人工智能（XAI）研究</li>\n<li>将可解释人工智能方法与无线通信系统结合</li>\n<li>设计用于信号分类的可解释机器学习模型</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">新加坡科技设计大学（SUTD）</div><div class=\"period\">2021年7月</div></div>\n<div class=\"sub\"><b>研究助理</b></div>\n<ul>\n<li>设计并实现基于人工智能的软件调制器</li>\n<li>实现了低成本、高灵活性的设计方案</li>\n<li>作为共同第一作者完成一篇投稿至 IEEE JSAC 的论文</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">东南大学（SEU）</div><div class=\"period\">2019年9月 – 2020年10月</div></div>\n<div class=\"sub\"><b>研究生科研人员</b></div>\n<ul>\n<li>研究 LoRa 网络中的并发通信问题</li>\n<li>设计并评估多维解调器</li>\n<li>发表关于冲突 LoRa 传输解码的 ICNP 2020 论文</li>\n<li>在此基础上进一步扩展并以第一作者身份投稿 IEEE TMC</li>\n</ul>\n</div>\n<div class=\"item\">\n<div class=\"row\"><div class=\"title\">东南大学（SEU）</div><div class=\"period\">2021年6月</div></div>\n<div class=\"sub\"><b>研究生科研人员</b></div>\n<ul>\n<li>聚焦无线传输中的冲突检测问题</li>\n<li>实现细粒度自相关检测器</li>\n<li>发表 WASA 2021 论文</li>\n</ul>\n</div>\n</div>\n<div class=\"section\"><h2>科研项目</h2><ul>\n<li><b>国家重点研发计划</b> — 异构设备间无网关跨技术通信</li>\n<li><b>国家自然科学基金（NSFC）</b>\n<ul>\n<li>大规模工业 LoRa 网络并发传输</li>\n<li>高能效 LPWAN 通信机制
