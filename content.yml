experience:
  - organization:
      en: University of Southern California / University of Minnesota
      zh: 南加州大学 / 明尼苏达大学双城分校
    role:
      en: Ph.D. Student
      zh: 博士研究生
    period:
      en: Aug. 2022 – Present
      zh: 2022年8月 – 至今
    details:
      - en: "Net-JEPA: Contribute to research on a 4M-parameter self-supervised world model that learns reusable network dynamics from telemetry for adaptive bitrate streaming (ABR) and congestion control (CC)."
        zh: "Net-JEPA：参与约 400 万参数的自监督世界模型研究，从网络遥测学习可复用的网络动态表征，支持自适应码率流媒体（ABR）与拥塞控制（CC）。"
      - en: "The framework combines latent dynamics prediction with lightweight linear readouts and model predictive control; ABR pretraining uses over 450,000 Puffer streams spanning more than 225,000 viewer sessions."
        zh: "该框架结合潜在动态预测、轻量线性读出与模型预测控制；ABR 预训练使用超过 45 万条 Puffer 流记录，覆盖逾 22.5 万个观看会话。"
      - en: "In trace-driven evaluation, the frozen ABR-pretrained model transfers to CC by fitting only the readout on 20 traces, achieving capacity forecast MSLE of 0.84 versus 1.93 for random initialization in an open-loop fluid-queue emulator."
        zh: "在轨迹驱动评估中，冻结 ABR 预训练模型，仅用 20 条轨迹拟合读出即可迁移至 CC；在开环流体队列仿真器中，容量预测 MSLE 为 0.84，随机初始化基线为 1.93。"
      - en: "Satellite link prediction (HotMobile 2026): Co-authored a hierarchical framework combining satellite geometry and network telemetry to predict upcoming connections, connection-window performance, and per-second link dynamics."
        zh: "卫星链路预测（HotMobile 2026）：合作提出融合卫星几何信息与网络遥测的分层框架，预测下一次卫星连接、连接窗口性能及逐秒链路变化。"
      - en: "Real-system evaluation on Starlink achieved throughput and latency mean absolute errors of 8.37 Mbps and 14.25 ms, respectively, versus 29.54 Mbps and 26.31 ms for a self-similar baseline."
        zh: "在真实 Starlink 系统上的评估中，吞吐量与时延平均绝对误差分别为 8.37 Mbps 和 14.25 ms，自相似基线分别为 29.54 Mbps 和 26.31 ms。"
      - en: "Video-call optimization (INFOCOM 2026 Poster): Co-authored a prediction-driven design for adapting video transmission and reconstruction to anticipated satellite-link degradation."
        zh: "视频通话优化（INFOCOM 2026 海报）：合作提出预测驱动的视频传输与重建设计，提前适应卫星链路性能下降。"
      - en: "Proposed a multi-satellite extension that prioritizes essential video information on higher-quality paths; preliminary measurements showed higher aggregate throughput and lower packet loss than single-dish configurations."
        zh: "提出多卫星扩展设计，优先通过高质量路径传输关键视频信息；初步测量显示，相比单终端配置可提高总吞吐量并降低丢包率。"
      - en: "Developed a multipath system using low-cost Raspberry Pi relay nodes to improve satellite network performance."
        zh: "开发采用低成本 Raspberry Pi 中继节点的多路径系统，以改善卫星网络性能。"
      - en: "Developed a WebRTC-based measurement system to record real-time video-call quality for networking research experiments."
        zh: "开发基于 WebRTC 的测量系统，记录实时视频通话质量，支持网络研究实验。"
      - en: "Developed an Android application to measure network latency and packet loss for networking research experiments."
        zh: "开发用于测量网络时延与丢包率的 Android 应用，支持网络研究实验。"

